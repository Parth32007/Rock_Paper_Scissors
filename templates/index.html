<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🎮 Rock Paper Scissors</h1>

        <div class="scoreboard">

            <div class="score-card">
                <h3>🏆 Wins</h3>
                <p id="wins">0</p>
            </div>

            <div class="score-card">
                <h3>❌ Losses</h3>
                <p id="losses">0</p>
            </div>

            <div class="score-card">
                <h3>🤝 Draws</h3>
                <p id="draws">0</p>
            </div>

        </div>

        <button id="reset-btn"
                onclick="resetScores()">
            Reset Score
        </button>
    </div>

</div>
        <div class="buttons">

            <button class="choice-btn"
                    onclick="playGame('rock')">
                ✊ Rock
            </button>

            <button class="choice-btn"
                    onclick="playGame('paper')">
                ✋ Paper
            </button>

            <button class="choice-btn"
                    onclick="playGame('scissors')">
                ✌️ Scissors
            </button>

        </div>

        <div class="result-box">

            <h2>Game Result</h2>

            <p id="user-choice">
                Your Choice: -
            </p>

            <p id="computer-choice">
                Computer Choice: -
            </p>

            <p id="winner">
                Winner: -
            </p>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
