<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">

        <h1>🎮 Rock Paper Scissors</h1>

        <div class="buttons">

            <button class="choice-btn">
                ✊ Rock
            </button>

            <button class="choice-btn">
                ✋ Paper
            </button>

            <button class="choice-btn">
                ✌️ Scissors
            </button>

        </div>

        <div class="result-box">

            <h2>Game Result</h2>

            <p>Your Choice: -</p>

            <p>Computer Choice: -</p>

            <p>Winner: -</p>

        </div>

    </div>

</body>
</html>
